name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')   # guards workflow_dispatch on a branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      # Node 24, matching the Web job in ci.yml. The UI shipped in the tarball
      # should be built and tested on the same major CI validated it on;
      # otherwise "CI was green" says nothing about the artifact.
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - name: Verify tag matches VERSION   # fail before any build cost
        run: |
          FILE_VER="$(tr -d '\r\n' < internal/version/VERSION | sed 's/^v//')"
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VER" != "$FILE_VER" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match internal/version/VERSION (${FILE_VER})"
            exit 1
          fi

      # A tagged release is now the install path: scripts/bootstrap-ubuntu.sh
      # downloads these artifacts rather than building from source on the
      # operator's host. Publishing without running the suite would ship
      # straight to every new install. Mirrors the Go job in ci.yml; the race
      # detector stays there, where it is not on the release critical path.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The web/dist built here is shipped inside the tarball, so it is the UI
      # every release install serves. Building it proves it compiles, not that
      # it works; run the suite too rather than shipping an untested UI.
      - name: Install web dependencies
        run: cd web && npm ci

      - name: Test web UI
        run: cd web && npm run test

      - name: Build web UI
        run: cd web && npm run build

      - name: Cross-compile server binaries
        run: |
          LDFLAGS="-X github.com/furious-fury/HostForge/internal/version.Commit=${GITHUB_SHA} -X github.com/furious-fury/HostForge/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" go build -ldflags "${LDFLAGS}" -o "dist/${ARCH}/hostforge-server" ./cmd/server
          done

      - name: Package tarballs + checksums
        run: |
          for ARCH in amd64 arm64; do
            mkdir -p "pkg/${ARCH}/web"
            cp "dist/${ARCH}/hostforge-server" "pkg/${ARCH}/"
            cp -r web/dist "pkg/${ARCH}/web/"
            tar -C "pkg/${ARCH}" -czf "hostforge-${GITHUB_REF_NAME}-linux-${ARCH}.tar.gz" hostforge-server web
          done
          sha256sum hostforge-${GITHUB_REF_NAME}-linux-*.tar.gz > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            hostforge-${GITHUB_REF_NAME}-linux-amd64.tar.gz \
            hostforge-${GITHUB_REF_NAME}-linux-arm64.tar.gz \
            checksums.txt \
            --title "${GITHUB_REF_NAME}" --generate-notes
