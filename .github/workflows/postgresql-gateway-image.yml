name: Publish PostgreSQL gateway image

on:
  workflow_dispatch:
  push:
    tags:
      - "postgresql-gateway-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: postgresql-gateway-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ./containers/postgresql-gateway
          file: ./containers/postgresql-gateway/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/hostforge-postgresql-gateway:sha-${{ github.sha }}
          cache-from: type=gha,scope=postgresql-gateway-amd64
          cache-to: type=gha,mode=max,scope=postgresql-gateway-amd64
